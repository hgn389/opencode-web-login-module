<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <title>Đăng nhập · OpenCode</title>
  <script src="/login/client.js" defer></script>
  <style>
    *{box-sizing:border-box}fieldset{border:0;padding:0;margin:0;min-width:0}fieldset:disabled{opacity:.45}.captcha{margin-top:20px}.captcha img{display:block;max-width:100%;height:auto;border-radius:8px;margin-bottom:10px}.captcha input{text-transform:uppercase;letter-spacing:3px}.captcha small{display:block;margin-top:8px;color:#90919b;font-size:12px}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#101113;color:#ededee;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(100%,420px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:36px;font-size:24px;font-weight:650;letter-spacing:-.8px}.mark{display:grid;place-items:center;width:44px;height:44px;border:1px solid #45464a;border-radius:12px;font:700 21px ui-monospace,monospace;color:#e9e9eb}section{padding:32px;border:1px solid #303137;border-radius:20px;background:#191a1d;box-shadow:0 20px 70px #0003}h1{margin:0 0 8px;font-size:25px;letter-spacing:-.6px}p{margin:0 0 26px;color:#aaabb2;font-size:14px}label{display:block;font-size:14px;font-weight:550;margin:18px 0 8px}input{width:100%;min-height:48px;padding:12px 14px;border:1px solid #42434a;border-radius:9px;background:#121316;color:inherit;font:inherit}input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #b9c9ff;outline-offset:3px}button{width:100%;min-height:48px;margin-top:26px;border:0;border-radius:9px;background:#ededee;color:#191a1d;font:600 15px system-ui;cursor:pointer}button:hover{background:#fff}.message{padding:12px 14px;border:1px solid #713e45;border-radius:9px;background:#42252b;color:#ffd0d6;font-size:14px;margin:20px 0 0}.message:empty{display:none}footer{text-align:center;margin-top:24px;color:#777982;font-size:12px}a{color:#c5c8d1}@media(max-width:480px){body{padding:20px}section{padding:24px}.brand{margin-bottom:26px}}@media(prefers-color-scheme:light){body{background:#f4f4f5;color:#1d1d20}section{background:#fff;border-color:#ddd;box-shadow:0 20px 70px #00000008}.mark{border-color:#ccc;color:#1d1d20}p{color:#65656e}input{background:#fafafa;border-color:#ccc}button{background:#232326;color:#fff}button:hover{background:#38383d}footer{color:#71717a}.captcha small{color:#65656e}a{color:#4a4a55}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">&gt;_</span>OpenCode</div>
    <section aria-labelledby="login-title">
      <h1 id="login-title">Đăng nhập</h1>
      <p>Đăng nhập để tiếp tục vào không gian làm việc.</p>
      <div class="message" role="alert">{{MESSAGE}}</div>
      <form method="post" action="/login">
        <fieldset {{FORM_STATE}}>
        <input type="hidden" name="csrf" value="{{CSRF}}">
        <input type="hidden" name="next" value="{{NEXT}}">
        <label for="username">Tên đăng nhập</label>
        <input id="username" name="username" type="text" value="opencode" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="128" required>
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="2048" required>
        {{CAPTCHA}}
        <button type="submit">Đăng nhập</button>
        </fieldset>
      </form>
    </section>
    <footer>OpenCode Web Login · v{{VERSION}}</footer>
  </main>
</body>
</html>
